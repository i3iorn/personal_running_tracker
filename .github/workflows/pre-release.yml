name: Pre-Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pre-release:
    name: Pre-Release Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Compile debug Kotlin
        run: ./gradlew --console=plain :app:compileDebugKotlin

      - name: Run unit tests
        run: ./gradlew --console=plain :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --console=plain :app:assembleDebug

      - name: Verify debug APK exists
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Debug APK was not produced at $APK"
            exit 1
          fi
          echo "Debug APK: $APK"
          ls -lh "$APK"

      - name: Extract app version from build.gradle.kts
        id: version
        run: |
          # Parse versionName from build.gradle.kts (e.g. versionName = "0.1.0")
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/' | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get short commit SHA
        id: commit
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create pre-release tag
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.version.outputs.version }}-${{ steps.commit.outputs.sha }}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          git tag -f "$TAG"
          git push -f origin "$TAG"

      - name: Create GitHub Pre-Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Pre-Release ${{ env.TAG }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
